name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-contracts:
    name: Repository Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application-ready: ${{ steps.inventory.outputs.application-ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicit workspace inventory
        id: inventory
        run: node scripts/ci/workspace-contract.mjs
      - name: Run real root tests and emit JUnit
        run: |
          mkdir -p reports/junit
          node --test --test-reporter=tap --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/junit/root.xml "scripts/__tests__/*.test.mjs"
      - name: Require executed root tests
        uses: 12-apps/ci/.github/actions/vitest-signal-guard@be3300542208ebab5b30a75f58d018518f9d3459 # v2.48.2
        with:
          reports: reports/junit/root.xml
          lane: repository-contracts
      - name: Every CI change is documented
        run: node scripts/ci/ci-change-documented.mjs
      - name: ADR records are well formed
        run: node scripts/adr/render-index.mjs --records
      # Application static is intentionally not invoked during bootstrap. Keep
      # workflow syntax checked without starting zero-task application jobs.
      - name: Lint workflow syntax
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  static:
    name: Static
    needs: repository-contracts
    if: needs.repository-contracts.outputs.application-ready == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: 12-apps/ci/.github/workflows/monorepo-static.yml@be3300542208ebab5b30a75f58d018518f9d3459 # v2.48.2
    with:
      node-version: '22'
      stack-aware: true
      # Complete MERGED tree, including modes, globals and documents tests read.
      # Conservative: no app-specific ignores; engine supplies execution context.
      lint-fingerprint-command: git rev-parse 'HEAD^{tree}'
      type-check-fingerprint-command: git rev-parse 'HEAD^{tree}'

  tests:
    name: Tests
    needs: [repository-contracts, static]
    if: needs.repository-contracts.outputs.application-ready == 'true' && needs.static.outputs.code == 'true'
    permissions:
      contents: read
    uses: 12-apps/ci/.github/workflows/monorepo-tests.yml@be3300542208ebab5b30a75f58d018518f9d3459 # v2.48.2
    with:
      node-version: '22'
      stack-aware: true
      unit-test-command: pnpm run test:ci
      unit-full-command: pnpm run test:ci:full
      unit-junit-reports: reports/junit/workspaces
      unit-fingerprint-command: git rev-parse 'HEAD^{tree}'
      build-fingerprint-command: git rev-parse 'HEAD^{tree}'
      # One runner until an actual app workload justifies sharding. Selective
      # per-test / skip-green inputs require the app's runner and measured plan.
      unit-shards: 1

  ci-success:
    name: CI Success
    if: always()
    needs: [repository-contracts, static, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real required work and expected skips
        env:
          CONTRACTS: ${{ needs.repository-contracts.result }}
          APPLICATION_READY: ${{ needs.repository-contracts.outputs.application-ready }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CODE: ${{ needs.static.outputs.code }}
        run: node scripts/ci/check-results.mjs
