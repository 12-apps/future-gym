<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one mobile column (max 480px) with a fixed tab bar; the session screen is a timer ring above the set log. */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --ink: #14161B;
  --muted: #5B6270;
  --line: #D7DBE1;
  --accent: #1D4ED8;
  --on-accent: #FFFFFF;
  /* Competition plate colours: 25 kg red, 20 kg blue, 15 kg yellow, 10 kg green */
  --plate-red: #CF3A2C;
  --plate-blue: #1D4ED8;
  --plate-yellow: #E0A612;
  --plate-green: #1B8A50;
  --plate-white: #E4E6EA;
  --plate-iron: #4A505B;
  --on-yellow: #1B1605;
  /* Volume status colours: reserved, always shown with a text label */
  --st-under: #C99612;
  --st-ok: #1B8A50;
  --st-high: #D4691A;
  --st-over: #C8322A;
  --exec: var(--plate-red);
  --rest: var(--plate-green);
  --shadow: 0 1px 2px rgba(20, 22, 27, .06), 0 8px 24px rgba(20, 22, 27, .06);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F13; --surface: #171A20; --surface-2: #1F232B; --ink: #ECEEF2; --muted: #99A0AC; --line: #2A2F38;
    --accent: #7194F8; --on-accent: #0D0F13;
    --plate-red: #F0604F; --plate-blue: #7194F8; --plate-yellow: #F2C23F; --plate-green: #3DBE7A; --plate-white: #D5D9E0; --plate-iron: #6B7280; --on-yellow: #1B1605;
    --st-under: #E9B93A; --st-ok: #3DBE7A; --st-high: #F08A3E; --st-over: #F0604F;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #171A20; --surface-2: #1F232B; --ink: #ECEEF2; --muted: #99A0AC; --line: #2A2F38;
  --accent: #7194F8; --on-accent: #0D0F13;
  --plate-red: #F0604F; --plate-blue: #7194F8; --plate-yellow: #F2C23F; --plate-green: #3DBE7A; --plate-white: #D5D9E0; --plate-iron: #6B7280; --on-yellow: #1B1605;
    --st-under: #E9B93A; --st-ok: #3DBE7A; --st-high: #F08A3E; --st-over: #F0604F;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 2.25rem; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; }
.eyebrow { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 110px; display: flex; flex-direction: column; gap: 24px; }
.app.no-tabbar { padding-bottom: 120px; }

/* Plate disc: the workout letter, coloured like a bumper plate */
.disc {
  --plate: var(--plate-blue); --on: #fff;
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  display: grid; place-items: center; background: var(--plate); color: var(--on);
  font: 700 1.35rem/1 var(--display);
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--plate) 70%, #000 30%), inset 0 0 0 9px var(--plate), inset 0 0 0 10px color-mix(in srgb, var(--on) 25%, transparent);
}
.disc.lg { width: 64px; height: 64px; font-size: 2rem; }
.disc.sm { width: 30px; height: 30px; font-size: 1rem; box-shadow: none; }
.p-A { --plate: var(--plate-red); --on: #fff; }
.p-B { --plate: var(--plate-blue); --on: #fff; }
.p-C { --plate: var(--plate-yellow); --on: var(--on-yellow); }
.p-D { --plate: var(--plate-green); --on: #fff; }
.p-E { --plate: var(--plate-white); --on: #1B1D22; }
.p-F { --plate: var(--plate-iron); --on: #fff; }
.disc.rest { --plate: var(--surface-2); --on: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; transition: transform .08s ease, background .15s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.go { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--plate-red); }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 1.1rem; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg, .btn svg { width: 20px; height: 20px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabbar-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: .75rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Home */
.today { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.today-head { display: flex; gap: 14px; align-items: center; }
.today-head > div { min-width: 0; }
.today h2 { font-size: 1.9rem; text-transform: none; letter-spacing: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .92rem; }

.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; border-radius: 12px; border: 1px solid transparent; }
.day .d { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.day .n { font: 600 1.15rem/1 var(--display); }
.day.today { border-color: var(--ink); background: var(--surface); }
.day .disc.sm.done { position: relative; }
.day .disc.sm.done::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--plate-green); }

.progress { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar > i { display: block; height: 100%; background: var(--plate-green); border-radius: inherit; }

.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: none; border: 0; width: 100%; text-align: left;
  border-top: 1px solid var(--line);
}
.list > .row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 600; }
.row .sub { color: var(--muted); font-size: .88rem; }
.row .when { width: 44px; flex: none; }
.row .when b { display: block; font: 700 1.05rem/1 var(--display); text-transform: uppercase; }
.row .when span { font-size: .8rem; color: var(--muted); }
.row.is-rest { color: var(--muted); }
.row.is-rest .title { font-weight: 500; }
.chip { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.today { background: var(--ink); color: var(--bg); }
.chip.done { background: color-mix(in srgb, var(--plate-green) 16%, transparent); color: var(--plate-green); }
.chevron { color: var(--muted); width: 18px; height: 18px; flex: none; }

.duel-teaser { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); border: 1px dashed var(--line); background: none; width: 100%; text-align: left; }

/* Workout detail */
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 0; color: var(--muted); font-weight: 600; }
.back svg { width: 18px; height: 18px; }
.w-head { display: flex; gap: 16px; align-items: center; }
.w-head > div { min-width: 0; }
.ex-list { counter-reset: ex; }
.ex-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-top: 1px solid var(--line); }
.ex-row:first-child { border-top: 0; }
.ex-row .idx { font: 700 1.25rem/1.2 var(--display); color: var(--muted); }
.ex-row .grow { min-width: 0; }
.ex-row .load { text-align: right; }
.ex-row .load b { font: 700 1.3rem/1 var(--display); display: block; }
.ex-row .load span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.partner-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .92rem; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bottom-bar-inner { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; }
.bottom-bar-inner .btn { flex: 1; }
.bottom-bar-inner .btn.shrink { flex: 0 0 auto; }

/* Session */
.s-top { display: flex; align-items: center; gap: 10px; }
.s-top .grow { flex: 1; min-width: 0; }
.s-top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-top .elapsed { font: 600 1rem/1 var(--display); color: var(--muted); }
.segments { display: flex; gap: 4px; }
.segments i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.segments i.done { background: var(--ink); }
.segments i.cur { background: var(--accent); }

.ex-head { display: flex; flex-direction: column; gap: 6px; }
.ex-head h1 { font-size: 2rem; }

.timer { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 8px 0 4px; }
.ring { position: relative; width: min(68vw, 260px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring .prog { fill: none; stroke: var(--phase, var(--ink)); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.phase-name { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--phase, var(--muted)); }
.clock { font: 700 clamp(3.6rem, 17vw, 4.6rem)/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.set-label { font-weight: 600; color: var(--muted); font-size: .95rem; }
.session[data-phase="exec"] { --phase: var(--exec); }
.session[data-phase="rest"] { --phase: var(--rest); }
.session[data-phase="exDone"] { --phase: var(--plate-green); }
.session.paused .clock { animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
.controls .btn { flex: 1 1 0; min-width: 0; }
.controls .btn.shrink { flex: 0 0 auto; }

.log-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.sets { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.set { display: grid; grid-template-columns: 40px minmax(0, 1fr) 56px auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); transition: background .2s; }
.set:first-child { border-top: 0; }
.set.cur { background: color-mix(in srgb, var(--phase, var(--accent)) 9%, transparent); }
.set-check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
.set-check svg { width: 18px; height: 18px; }
.set.done .set-check { background: var(--plate-green); border-color: var(--plate-green); color: #fff; }
.set.cur .set-check { border-color: var(--phase, var(--accent)); }
.set-n { font-weight: 600; line-height: 1.2; min-width: 0; }
.set-n small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
.field { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.field label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input { width: 100%; height: 40px; text-align: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.kg { display: flex; align-items: flex-end; gap: 4px; }
.kg .field { width: 62px; }
.step { width: 32px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.1rem; line-height: 1; }
.hint { font-size: .85rem; color: var(--muted); }

/* Summary / cards */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat b { font: 700 1.6rem/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hero-done { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
.hero-done h1 { font-size: 3rem; }
.loads-line { font-variant-numeric: tabular-nums; }

/* Duel */
.formula { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.formula code { font: 600 .95rem/1.4 var(--display); letter-spacing: .02em; }
.board { display: flex; flex-direction: column; gap: 10px; }
.rank { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; align-items: center; }
.rank.lead { border-color: var(--ink); }
.rank .pos { font: 700 1.5rem/1 var(--display); color: var(--muted); }
.rank.lead .pos { color: var(--plate-yellow); }
.rank .who { min-width: 0; }
.rank .who b { display: block; }
.rank .who span { font-size: .85rem; color: var(--muted); }
.rank .score { text-align: right; }
.rank .score b { font: 700 1.9rem/1 var(--display); font-variant-numeric: tabular-nums; }
.rank .score span { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rank .bar { grid-column: 2 / 4; height: 6px; }
.rank .bar > i { background: var(--accent); }
.rank.me .bar > i { background: var(--ink); }

.form { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
.form-row > * { flex: 1 1 140px; min-width: 0; }
.input { display: flex; flex-direction: column; gap: 4px; }
.input label { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input input { height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-weight: 600; }
.inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty b { color: var(--ink); }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; background: rgba(8, 10, 14, .45); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { max-height: calc(100% - 8px); overflow-y: auto; max-width: 448px; width: 100%; margin: 0 auto; background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet h2 { text-transform: none; letter-spacing: 0; font-size: 1.6rem; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); }

/* Plan editor */
.splits { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.split { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.split b { font: 700 1.2rem/1.1 var(--display); }
.split span { font-size: .75rem; color: var(--muted); line-height: 1.25; }
.split[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day-row { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.day-row:first-child { border-top: 0; }
.day-row > b { font: 700 1.05rem/1 var(--display); text-transform: uppercase; }
.day-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.day-pick button { box-shadow: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font: 700 1rem/1 var(--display); color: var(--muted); padding: 0; }
.day-pick button[aria-pressed="true"].disc { color: var(--on); background: var(--plate); border-color: transparent; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--plate); }
.day-pick button.off { width: auto; padding: 0 12px; border-radius: 99px; font: 600 .82rem/1 var(--body); }
.day-pick button.off[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ed-ex { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 12px 12px 12px 16px; border-top: 1px solid var(--line); }
.ed-ex:first-child { border-top: 0; }
.ed-ex .grow { min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.ed-ex .idx { font: 700 1.15rem/1 var(--display); color: var(--muted); }
.ed-ex .moves { display: flex; gap: 4px; }
.ed-ex .moves .icon-btn { width: 36px; height: 36px; border-radius: 10px; }
.ed-ex .moves .icon-btn svg { width: 16px; height: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.notice { padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--plate-yellow) 16%, transparent); font-size: .9rem; }

/* Weekly volume and muscle subgroups */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; white-space: nowrap; }

const fmtDur = (sec) => { const m = Math.round(sec / 60); return m >= 60 ? Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0') : m + ' min'; };
const parseNum = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const uid = () => Math.random().toString(36).slice(2, 9);
const dateKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dayIdx = (d) => (d.getDay() + 6) % 7;
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - dayIdx(x)); return x; }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function weekDays() {
  const mon = mondayOf(new Date());
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
}
function weekLabel() {
  const days = weekDays(), a = days[0], b = days[6];
  return 'Semana ' + isoWeek(a) + ' · ' + a.getDate() + ' ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()];
}
const inThisWeek = (key) => { const days = weekDays(); return key >= dateKey(days[0]) && key <= dateKey(days[6]); };
const totals = (w) => ({
  sets: w.exercises.reduce((a, e) => a + e.sets, 0),
  sec: w.exercises.reduce((a, e) => a + e.sets * e.exec + (e.sets - 1) * e.rest + 90, 0),
});
function logVolume(log) {
  let v = 0, sets = 0;
  Object.values(log).forEach((arr) => arr.forEach((s) => { if (s.done) { v += (s.kg || 0) * (s.reps || 0); sets++; } }));
  return { volume: Math.round(v), sets };
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
}
const partnerById = (id) => partners.find((p) => p.id === id);

const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  chev: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg>',

  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>',
};

/* ------------------------------------------------------------------ *
 * Sounds (Web Audio) and vibration                                   *
 * ------------------------------------------------------------------ */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, at, dur, type = 'sine', gain = 0.3) {
  const t = actx.currentTime + at;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function play(kind) {
  const vib = { setEnd: [180, 90, 180, 90, 180], restEnd: [400, 120, 400], exDone: [120, 60, 120, 60, 500], tick: [30] }[kind];
  try { if (navigator.vibrate && vib) navigator.vibrate(vib); } catch (e) {}
  if (!settings.sound || !actx) return;
  try {
    if (kind === 'tick') tone(1320, 0, 0.07, 'sine', 0.12);
    // End of set: sharp alarm, three short beeps
    if (kind === 'setEnd') [0, 0.2, 0.4].forEach((t) => tone(1046, t, 0.14, 'square', 0.18));
    // End of rest: rising arpeggio, the "go!" cue
    if (kind === 'restEnd') [[523, 0], [659, 0.12], [784, 0.24], [1046, 0.36]].forEach(([f, t]) => tone(f, t, t === 0.36 ? 0.5 : 0.14, 'triangle', 0.32));
    // Exercise done: chord
    if (kind === 'exDone') [523, 659, 784].forEach((f) => tone(f, 0, 0.9, 'triangle', 0.2));
  } catch (e) {}
}

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } } catch (e) {} }
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) keepAwake(); });

/* ------------------------------------------------------------------ *
 * Workout state machine                                               *
 * phases: ready → exec → rest → exec … → exDone                       *
 * ------------------------------------------------------------------ */
const curW = () => WORKOUTS[S.workoutId];
const curEx = () => curW().exercises[S.exIndex];
const persist = () => store.set('fg.session', S);

function buildLog(w, source) {
  const log = {};
  w.exercises.forEach((ex) => {
    const prev = (source && source[ex.id]) || [];
    log[ex.id] = Array.from({ length: ex.sets }, (_, i) => {
      const p = prev[i] || prev[prev.length - 1];
      return { kg: p ? p.kg : ex.load, reps: ex.reps, done: false };
    });
  });
  return log;
}

function startWorkout(id) {
  ensureAudio();
  const w = WORKOUTS[id];
  const logs = { me: buildLog(w, loads) };
  const pid = ui.withPartner && partnerById(ui.withPartner) ? ui.withPartner : null;
  if (pid) logs[pid] = buildLog(w, partnerLoads[pid]);
  S = { workoutId: id, startedAt: Date.now(), exIndex: 0, setIndex: 0, phase: 'ready', duration: 0, endsAt: null, paused: false, remaining: null, partnerId: pid, logs };
  ui.owner = 'me';
  persist(); keepAwake();
  go('session');
}

function nextPending(ex) { return S.logs.me[ex.id].findIndex((s) => !s.done); }

function startPhase(phase, sec, base) {
  S.phase = phase; S.duration = sec * 1000; S.endsAt = (base || Date.now()) + sec * 1000;
  S.paused = false; S.remaining = null; lastTickSec = null;
  persist(); updateSession();
}

function beginExercise() {
  ensureAudio(); keepAwake();
  const i = nextPending(curEx());
  S.setIndex = i < 0 ? 0 : i;
  play('restEnd');
  startPhase('exec', curEx().exec);
}

function finishSet(auto) {
  const ex = curEx();
  const late = auto && Date.now() - S.endsAt > 3000; // the app was in the background: do not stack sounds
  const base = auto ? S.endsAt : Date.now();
  S.logs.me[ex.id][S.setIndex].done = true;
  if (S.partnerId) S.logs[S.partnerId][ex.id][S.setIndex].done = true;
  saveLoads(ex);
  const next = nextPending(ex);
  if (next < 0) {
    S.phase = 'exDone'; S.endsAt = null; S.paused = false;
    if (!late) play('exDone');
    persist(); updateSession();
  } else {
    S.setIndex = next;
    if (!late) play('setEnd');
    startPhase('rest', ex.rest, base);
  }
}

function endRest(auto) {
  const late = auto && Date.now() - S.endsAt > 3000;
  const base = auto ? S.endsAt : Date.now();
  if (!late) play('restEnd');
  startPhase('exec', curEx().exec, base);
}

function togglePause() {
  if (!S.endsAt) return;
  if (S.paused) { S.endsAt = Date.now() + S.remaining; S.paused = false; S.remaining = null; }
  else { S.remaining = Math.max(0, S.endsAt - Date.now()); S.paused = true; }
  persist(); updateSession();
}

function addTime(sec) {
  if (S.phase !== 'rest') return;
  S.duration += sec * 1000;
  if (S.paused) S.remaining += sec * 1000; else S.endsAt += sec * 1000;
  persist(); updateSession();
}

function gotoExercise(i) {
  S.exIndex = i; S.phase = 'ready'; S.endsAt = null; S.paused = false; S.remaining = null;
  const p = nextPending(curEx()); S.setIndex = p < 0 ? 0 : p;
  persist(); render(); window.scrollTo({ top: 0 });
}

function saveLoads(ex) {
  loads[ex.id] = S.logs.me[ex.id].map((s) => ({ kg: s.kg, reps: s.reps }));
  store.set('fg.loads', loads);
  if (S.partnerId) {
    const pl = partnerLoads[S.partnerId] || (partnerLoads[S.partnerId] = {});
    pl[ex.id] = S.logs[S.partnerId][ex.id].map((s) => ({ kg: s.kg, reps: s.reps }));
    store.set('fg.partnerLoads', partnerLoads);
  }
}

function finishWorkout() {
  const w = curW();
  w.exercises.forEach(saveLoads);
  const mine = logVolume(S.logs.me);
  const entry = {
    id: uid(), workoutId: w.id, name: w.name, date: dateKey(new Date(S.startedAt)),
    startedAt: S.startedAt, durationSec: Math.round((Date.now() - S.startedAt) / 1000),
    volume: mine.volume, sets: mine.sets, bw: profile.bw,
    exercises: w.exercises.map((ex) => ({ id: ex.id, name: ex.name, sets: S.logs.me[ex.id] })),
  };
  if (S.partnerId) {
    const p = partnerById(S.partnerId);
    const pv = logVolume(S.logs[S.partnerId]);
    if (p) entry.partner = { id: p.id, name: p.name, bw: p.bw, volume: pv.volume, sets: pv.sets };
  }
  history.unshift(entry); store.set('fg.history', history);
  S = null; store.del('fg.session'); releaseAwake();
  ui.summary = entry;
  closeModal(); go('summary');
}

function discardWorkout() {
  S = null; store.del('fg.session'); releaseAwake();
  closeModal(); go('home');
}

/* Clock: computed from wall-clock time, so it stays correct while the tab is in the background. */
let lastTickSec = null;
setInterval(() => {
  if (!S || S.paused || !S.endsAt) return;
  const rem = S.endsAt - Date.now();
  if (rem <= 0) { if (S.phase === 'exec') finishSet(true); else if (S.phase === 'rest') endRest(true); return; }
  const sec = Math.ceil(rem / 1000);
  if (sec <= 3 && sec !== lastTickSec) { lastTickSec = sec; play('tick'); }
  if (ui.view === 'session') updateSession();
}, 200);
setInterval(() => { if (S && ui.view === 'session') { const el = $('#elapsed'); if (el) el.textContent = fmtClock((Date.now() - S.startedAt) / 1000); } }, 1000);

/* ------------------------------------------------------------------ *
 * Duel: weekly tonnage ÷ body weight                                 *
 * ------------------------------------------------------------------ */
function weeklyBoard() {
  const week = history.filter((h) => inThisWeek(h.date));
  const meVol = week.reduce((a, h) => a + h.volume, 0);
  const rows = [{ id: 'me', name: 'Você', bw: profile.bw, volume: meVol, sessions: week.length, me: true }];
  partners.forEach((p) => {
    const together = week.filter((h) => h.partner && h.partner.id === p.id);
    const solo = partnerExtra.filter((x) => x.partnerId === p.id && inThisWeek(x.date));
    rows.push({ id: p.id, name: p.name, bw: p.bw, volume: together.reduce((a, h) => a + h.partner.volume, 0) + solo.reduce((a, x) => a + x.volume, 0), sessions: together.length + solo.length });
  });
  rows.forEach((r) => (r.score = r.bw > 0 ? r.volume / r.bw : 0));
  rows.sort((a, b) => b.score - a.score || (a.me ? -1 : 1));
  return rows;
}

/* ------------------------------------------------------------------ *
 * Rendering                                                           *
 * ------------------------------------------------------------------ */
function go(view, extra) { Object.assign(ui, { view }, extra || {}); render(); window.scrollTo({ top: 0 }); }

function render() {
  const v = ui.view;
  const tabbar = $('#tabbar');
  tabbar.hidden = v === 'session' || v === 'workout' || v === 'summary' || v === 'edit';
  app.classList.toggle('no-tabbar', tabbar.hidden);
  tabbar.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.view === v ? 'page' : 'false'));
  if (v === 'home') app.innerHTML = viewHome();
  else if (v === 'workout') app.innerHTML = viewWorkout();
  else if (v === 'session') { app.innerHTML = viewSession(); sessionKey = {}; updateSession(); }
  else if (v === 'summary') app.innerHTML = viewSummary();
  else if (v === 'duel') app.innerHTML = viewDuel();
  else if (v === 'history') app.innerHTML = viewHistory();
  else if (v === 'plan') app.innerHTML = viewPlan();
  else if (v === 'edit') app.innerHTML = WORKOUTS[ui.editId] ? viewEdit() : viewPlan();
}

function doneOn(key) { return history.find((h) => h.date === key); }

function viewHome() {
  const days = weekDays(), todayKey = dateKey(new Date()), ti = dayIdx(new Date());
  const planned = WEEK_PLAN.filter(Boolean).length || 1;
  const doneCount = days.filter((d) => doneOn(dateKey(d))).length;
  const todayW = WEEK_PLAN[ti] && WORKOUTS[WEEK_PLAN[ti]];

  let hero;
  if (S) {
    const w = WORKOUTS[S.workoutId];
    hero = `<section class="today">
      <div class="today-head"><div class="disc lg p-${w.id}">${w.id}</div>
        <div><div class="eyebrow">Treino em andamento</div><h2>${esc(w.name)}</h2>
        <div class="meta"><span>Exercício ${S.exIndex + 1} de ${w.exercises.length}</span></div></div></div>
      <button class="btn primary big block" data-action="resume">Voltar ao treino</button>
    </section>`;
  } else if (todayW && !todayW.exercises.length) {
    hero = `<section class="today">
      <div class="today-head"><div class="disc lg p-${todayW.id}">${todayW.id}</div>
        <div><div class="eyebrow">Hoje · ${DAY_LONG[ti]}</div><h2>${esc(todayW.name)}</h2>
        <div class="meta"><span>Nenhum exercício cadastrado</span></div></div></div>
      <button class="btn primary big block" data-action="editW" data-id="${todayW.id}">Cadastrar exercícios</button>
    </section>`;
  } else if (todayW) {
    const t = totals(todayW), done = doneOn(todayKey);
    hero = `<section class="today">
      <div class="today-head"><div class="disc lg p-${todayW.id}">${todayW.id}</div>
        <div><div class="eyebrow">Hoje · ${DAY_LONG[ti]}</div><h2>${esc(todayW.name)}</h2>
        <div class="meta"><span>${todayW.exercises.length} exercícios</span><span>${t.sets} séries</span><span>~${fmtDur(t.sec)}</span></div></div></div>
      ${done ? `<div class="chip done" style="align-self:flex-start">Concluído hoje · ${fmtNum(done.volume)} kg</div>` : ''}
      <button class="btn ${done ? '' : 'primary'} big block" data-action="open" data-id="${todayW.id}">${done ? 'Ver treino' : 'Abrir treino de hoje'}</button>
    </section>`;
  } else {
    const nw = nextIdx >= 0 ? WORKOUTS[WEEK_PLAN[nextIdx]] : null;
    hero = `<section class="today">
      <div class="today-head"><div class="disc lg rest">–</div>
        <div><div class="eyebrow">Hoje · ${DAY_LONG[ti]}</div><h2>Dia de descanso</h2>
        <div class="meta"><span>${nw ? 'Próximo: Treino ' + nw.id + ' · ' + DAY_LONG[nextIdx] : 'Semana encerrada. Bom trabalho.'}</span></div></div></div>
      ${nw ? `<button class="btn block" data-action="open" data-id="${nw.id}">Ver Treino ${nw.id}</button>` : ''}
    </section>`;
  }

  const strip = days.map((d, i) => {
    const w = WORKOUTS[WEEK_PLAN[i]] ? WEEK_PLAN[i] : null, key = dateKey(d), done = doneOn(key);
    return `<div class="day ${key === todayKey ? 'today' : ''}">
      <span class="d">${DAY_SHORT[i]}</span><span class="n num">${d.getDate()}</span>
      ${w ? `<span class="disc sm p-${w} ${done ? 'done' : ''}" aria-label="Treino ${w}${done ? ' concluído' : ''}">${w}</span>` : '<span class="disc sm rest" aria-label="Descanso">·</span>'}
    </div>`;
  }).join('');

  const rows = days.map((d, i) => {
    const wid = WORKOUTS[WEEK_PLAN[i]] ? WEEK_PLAN[i] : null, key = dateKey(d), done = doneOn(key);
    const when = `<div class="when"><b>${DAY_SHORT[i]}</b><span class="num">${d.getDate()}/${String(d.getMonth() + 1).padStart(2, '0')}</span></div>`;
    if (!wid) return `<div class="row is-rest">${when}<span class="disc sm rest">·</span><div class="grow"><div class="title">Descanso</div></div></div>`;
    const w = WORKOUTS[wid], t = totals(w);

    return `<button class="row" data-action="open" data-id="${wid}">${when}<span class="disc sm p-${wid}">${wid}</span>

  }).join('');

  let teaser = '';
  if (partners.length) {
    const b = weeklyBoard(), leader = b[0], me = b.find((r) => r.me), second = b[1];

  }

    <header style="display:flex;flex-direction:column;gap:6px">

    </header>

    <section class="section">
