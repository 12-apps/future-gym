        <div class="bar"><i style="width:${Math.min(100, (doneCount / planned) * 100)}%"></i></div>
      </div>
    </section>
    ${teaser}
    ${volumeTeaser()}
    <section class="section">
      <div class="section-head"><h2>Ficha da semana</h2><button class="link" data-action="nav" data-view="plan">Editar ficha</button></div>
      <div class="list">${rows}</div>
    </section>`;
}

function volumeTeaser() {
  const rows = weeklyVolume(), n = (st) => rows.filter((r) => r.st === st).length, goal = GOALS[profile.goal || 'maint'].label;
  const parts = [n('over') && `<span class="st st-over" data-icon="!">${n('over')} em excesso</span>`, n('high') && `<span class="st st-high" data-icon="↑">${n('high')} alto</span>`,
    n('under') && `<span class="st st-under" data-icon="↓">${n('under')} abaixo</span>`, n('ok') && `<span class="st st-ok" data-icon="✓">${n('ok')} no ideal</span>`].filter(Boolean);
  return `<button class="duel-teaser" data-action="volLink"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Volume da semana · ${goal}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px">${parts.join('')}</div></div>${ICON.chev}</button>`;
}

function viewWorkout() {
  const w = WORKOUTS[ui.workoutId], t = totals(w);
  const exRows = w.exercises.map((ex, i) => {
    const last = loads[ex.id];
    const kg = last && last.length ? Math.max(...last.map((s) => s.kg || 0)) : ex.load;
    return `<div class="ex-row"><span class="idx num">${i + 1}</span>
      <div class="grow"><div class="title" style="font-weight:600">${esc(ex.name)}</div>
      <div class="sub muted" style="font-size:.88rem">${esc(exMuscle(ex))}</div>
      <div class="sub muted num" style="font-size:.88rem">${ex.sets} × ${ex.reps} reps · ${ex.exec}s série · ${ex.rest}s intervalo</div></div>
      <div class="load"><b class="num">${fmtKg(kg)}</b><span>${last ? 'última kg' : 'sugestão kg'}</span></div></div>`;
  }).join('');
  const pick = partners.length ? `<section class="section">
      <div class="section-head"><h2>Treinar com</h2><button class="link" data-action="nav" data-view="duel">Parceiros</button></div>
      <div class="partner-pick">
        <button class="pill" data-action="pickPartner" data-id="" aria-pressed="${!ui.withPartner}">Sozinho</button>
        ${partners.map((p) => `<button class="pill" data-action="pickPartner" data-id="${p.id}" aria-pressed="${ui.withPartner === p.id}">${esc(p.name)}</button>`).join('')}
      </div>
      <p class="hint" style="margin:0">Com parceiro, você anota as cargas dos dois e a tonelagem conta no duelo.</p>
    </section>` : `<button class="duel-teaser" data-action="nav" data-view="duel"><div style="flex:1;min-width:0"><div class="title" style="font-weight:600">Treina com alguém?</div><div class="hint">Adicione um parceiro e dispute tonelagem pelo peso corporal.</div></div>${ICON.chev}</button>`;
  return `
    <button class="back" data-action="nav" data-view="home">${ICON.back} Ficha</button>
    <header class="w-head"><div class="disc lg p-${w.id}">${w.id}</div>
      <div><div class="eyebrow">Treino ${w.id}</div><h1>${esc(w.name)}</h1>
      <div class="meta num"><span>${w.exercises.length} exercícios</span><span>${t.sets} séries</span><span>~${fmtDur(t.sec)}</span></div></div>
    </header>
    <section class="section"><div class="section-head"><h2>Exercícios</h2>${S && S.workoutId === w.id ? '' : `<button class="link" data-action="editW" data-id="${w.id}">Editar</button>`}</div>
      ${w.exercises.length ? `<div class="list ex-list">${exRows}</div>` : `<div class="empty"><b>Nenhum exercício neste treino</b><span>Cadastre os exercícios, séries, repetições e intervalos.</span><button class="btn primary" data-action="editW" data-id="${w.id}">Cadastrar exercícios</button></div>`}
    </section>
    ${w.exercises.length ? pick : ''}
    <div class="bottom-bar"><div class="bottom-bar-inner">
      ${S ? `<button class="btn primary big" data-action="resume">Voltar ao treino em andamento</button>` : w.exercises.length ? `<button class="btn primary big" data-action="start" data-id="${w.id}">${ICON.play} Iniciar treino</button>` : `<button class="btn primary big" data-action="editW" data-id="${w.id}">Cadastrar exercícios</button>`}
    </div></div>`;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* Session: markup rendered once per exercise; the clock only updates parts of it. */
const RING_C = 2 * Math.PI * 100;
let sessionKey = {};
function viewSession() {
  const w = curW(), ex = curEx();
  const last = loads[ex.id];
  const segs = w.exercises.map((e, i) => `<i class="${i < S.exIndex ? 'done' : i === S.exIndex ? 'cur' : ''}"></i>`).join('');
  const p = S.partnerId && partnerById(S.partnerId);
  if (!p) ui.owner = 'me';
  return `
    <div class="session" id="session" data-phase="${S.phase}" style="display:flex;flex-direction:column;gap:20px">
      <div class="s-top">
        <button class="icon-btn" data-action="askEnd" aria-label="Encerrar treino">${ICON.close}</button>
        <div class="grow"><div class="title">Treino ${w.id} · ${esc(w.name)}</div><div class="elapsed num">Tempo total <span id="elapsed">${fmtClock((Date.now() - S.startedAt) / 1000)}</span></div></div>
        <button class="icon-btn" data-action="sound" id="soundBtn" aria-label="${settings.sound ? 'Desligar som' : 'Ligar som'}">${settings.sound ? ICON.soundOn : ICON.soundOff}</button>
      </div>
      <div class="segments" aria-hidden="true">${segs}</div>
      <div class="ex-head">
        <div class="eyebrow">Exercício ${S.exIndex + 1} de ${w.exercises.length}${exMuscle(ex) ? ' · ' + esc(exMuscle(ex)) : ''}</div>
        <h1>${esc(ex.name)}</h1>
        <div class="meta num"><span>${ex.sets} × ${ex.reps} reps</span><span>${ex.exec}s por série</span><span>${ex.rest}s de intervalo</span></div>
      </div>
      <div class="timer">
        <div class="ring">
          <svg viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="100"/><circle class="prog" id="ringProg" cx="110" cy="110" r="100" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg>
          <div class="ring-label"><span class="phase-name" id="phaseName"></span><span class="clock" id="clock" role="timer"></span><span class="set-label" id="setLabel"></span></div>
        </div>
        <div class="controls" id="controls"></div>
      </div>
      <section class="section">
        <div class="log-head"><h2>Cargas</h2>
          ${p ? `<div class="seg" role="group" aria-label="De quem são as cargas">
            <button data-action="owner" data-id="me" aria-pressed="${ui.owner === 'me'}">Você</button>
            <button data-action="owner" data-id="${p.id}" aria-pressed="${ui.owner === p.id}">${esc(p.name)}</button></div>` : ''}
        </div>
        <div class="sets" id="sets">${setsRows(ex)}</div>
        <p class="hint" style="margin:0">${last ? 'Última vez: <span class="loads-line">' + last.map((s) => fmtKg(s.kg)).join(' · ') + ' kg</span>. ' : ''}${p ? 'As séries de ' + esc(p.name) + ' são marcadas junto com as suas; desmarque se a pessoa pulou alguma.' : 'Toque no círculo para marcar uma série sem usar o timer.'}</p>
      </section>
      <div class="bottom-bar"><div class="bottom-bar-inner" id="nav"></div></div>
    </div>`;
}

function setsRows(ex) {
  const log = S.logs[ui.owner][ex.id];
  return log.map((s, i) => `
    <div class="set" data-row="${i}">
      <button class="set-check" data-action="toggleSet" data-set="${i}" aria-label="Marcar série ${i + 1}">${ICON.check}</button>
      <div class="set-n">Série ${i + 1}<small>meta ${ex.reps}</small></div>
      <div class="field"><label for="r-${ex.id}-${i}">reps</label><input id="r-${ex.id}-${i}" inputmode="numeric" data-field="reps" data-set="${i}" value="${s.reps}"></div>
      <div class="kg">
        <button class="step" data-action="step" data-set="${i}" data-d="-2.5" aria-label="Diminuir 2,5 kg">−</button>
        <div class="field"><label for="k-${ex.id}-${i}">kg</label><input id="k-${ex.id}-${i}" inputmode="decimal" data-field="kg" data-set="${i}" value="${fmtKg(s.kg)}"></div>
        <button class="step" data-action="step" data-set="${i}" data-d="2.5" aria-label="Aumentar 2,5 kg">+</button>
      </div>
    </div>`).join('');
}

function setHTML(id, key, html) {
  if (sessionKey[id] === key) return;
  sessionKey[id] = key; const el = document.getElementById(id); if (el) el.innerHTML = html;
}

function updateSession() {
  const root = $('#session'); if (!root) return;
  const ex = curEx(), w = curW();
  root.dataset.phase = S.phase;
  root.classList.toggle('paused', !!S.paused);

  let rem = 0, frac = 1;
  if (S.phase === 'exec' || S.phase === 'rest') {
    rem = S.paused ? S.remaining : Math.max(0, S.endsAt - Date.now());
    frac = S.duration ? rem / S.duration : 0;
  }
  const names = { ready: 'Pronto', exec: 'Execução', rest: 'Intervalo', exDone: 'Concluído' };
  $('#phaseName').textContent = (S.paused ? 'Pausado · ' : '') + names[S.phase];
  $('#clock').textContent = S.phase === 'ready' ? fmtClock(ex.exec) : S.phase === 'exDone' ? '✓' : fmtClock(Math.ceil(rem / 1000));
  $('#setLabel').textContent =
    S.phase === 'ready' ? `${ex.sets} séries de ${ex.reps}` :
    S.phase === 'exec' ? `Série ${S.setIndex + 1} de ${ex.sets}` :
    S.phase === 'rest' ? `Próxima: série ${S.setIndex + 1} de ${ex.sets}` :
    `${ex.sets} séries feitas`;
  $('#ringProg').style.strokeDashoffset = String(RING_C * (1 - frac));

  const ctlKey = S.phase + (S.paused ? 'p' : '');
  const pauseBtn = `<button class="btn shrink" data-action="pause" aria-label="${S.paused ? 'Retomar' : 'Pausar'}">${S.paused ? ICON.play + ' Retomar' : ICON.pause + ' Parar'}</button>`;
  setHTML('controls', ctlKey,
    S.phase === 'ready' ? `<button class="btn go big" data-action="begin">${ICON.play} Iniciar exercício</button>` :
    S.phase === 'exec' ? `${pauseBtn}<button class="btn go" data-action="setDone">${ICON.check} Série concluída</button>` :
    S.phase === 'rest' ? `${pauseBtn}<button class="btn shrink" data-action="add" aria-label="Mais 15 segundos">+15s</button><button class="btn go" data-action="skipRest">${ICON.skip} Pular</button>` :
    `<p class="hint" style="margin:0;text-align:center">Exercício concluído. Revise as cargas abaixo.</p>`);

  const log = S.logs[ui.owner][ex.id];
  document.querySelectorAll('#sets .set').forEach((row) => {
    const i = +row.dataset.row;
    row.classList.toggle('done', !!log[i].done);
    row.classList.toggle('cur', (S.phase === 'exec' || S.phase === 'rest') && i === S.setIndex);
  });

  const isLast = S.exIndex === w.exercises.length - 1;
  const navKey = S.exIndex + '|' + (S.phase === 'exDone');
  setHTML('nav', navKey,
    `${S.exIndex > 0 ? `<button class="btn shrink" data-action="prevEx" aria-label="Exercício anterior">${ICON.back}</button>` : ''}` +
    (isLast
      ? `<button class="btn ${S.phase === 'exDone' ? 'primary' : ''} big" data-action="askFinish">${ICON.check} Concluir treino</button>`
      : `<button class="btn ${S.phase === 'exDone' ? 'primary' : ''} big" data-action="nextEx">Próximo exercício ›</button>`));
}

function viewSummary() {
  const h = ui.summary; if (!h) return viewHome();
  const prev = history.find((x) => x.id !== h.id && x.workoutId === h.workoutId);
  const delta = prev ? h.volume - prev.volume : null;
  const lines = h.exercises.map((e) => {
    const done = e.sets.filter((s) => s.done);
    return `<div class="row"><div class="grow"><div class="title">${esc(e.name)}</div>
      <div class="sub loads-line">${done.length ? done.map((s) => fmtKg(s.kg)).join(' · ') + ' kg' : 'Não realizado'}</div></div>
      <span class="chip num">${done.length}/${e.sets.length}</span></div>`;
  }).join('');
  let duel = '';
  if (h.partner) {
    const me = h.volume / (h.bw || profile.bw), them = h.partner.volume / h.partner.bw;
    const win = me === them ? 'Empate no treino de hoje' : me > them ? 'Você venceu o treino de hoje' : `${esc(h.partner.name)} venceu o treino de hoje`;
    duel = `<section class="section"><h2>Duelo do treino</h2><div class="board">
      ${[{ n: 'Você', v: h.volume, bw: h.bw || profile.bw, s: me, me: true }, { n: esc(h.partner.name), v: h.partner.volume, bw: h.partner.bw, s: them }]
        .sort((a, b) => b.s - a.s).map((r, i) => `<div class="rank ${i === 0 ? 'lead' : ''} ${r.me ? 'me' : ''}"><span class="pos">${i + 1}</span>
        <div class="who"><b>${r.n}</b><span class="num">${fmtNum(r.v)} kg ÷ ${fmtKg(r.bw)} kg</span></div>
        <div class="score"><b>${fmtNum(r.s, 1)}</b><span>pts</span></div></div>`).join('')}
      </div><p class="hint" style="margin:0">${win}.</p></section>`;
  }
  return `
    <header class="hero-done"><div class="disc lg p-${h.workoutId}">${h.workoutId}</div>
      <div class="eyebrow">Treino ${h.workoutId} · ${esc(h.name)}</div><h1>Treino concluído</h1>
      ${delta !== null ? `<p class="muted" style="margin:0">${delta >= 0 ? '+' : '−'}${fmtNum(Math.abs(delta))} kg de tonelagem em relação ao último Treino ${h.workoutId}.</p>` : ''}
    </header>
    <div class="stats">
      <div class="stat"><b>${fmtDur(h.durationSec)}</b><span>Duração</span></div>
      <div class="stat"><b class="num">${h.sets}</b><span>Séries</span></div>
      <div class="stat"><b class="num">${fmtNum(h.volume)}</b><span>kg total</span></div>
    </div>
    ${duel}
    <section class="section"><h2>Cargas anotadas</h2><div class="list">${lines}</div></section>
    <div class="bottom-bar"><div class="bottom-bar-inner"><button class="btn primary big" data-action="nav" data-view="home">Voltar à ficha</button></div></div>`;
}

function viewDuel() {
  const board = weeklyBoard(), top = Math.max(...board.map((r) => r.score), 1);
  const f = ui.form || {};
  const ranks = board.map((r, i) => `
    <div class="rank ${i === 0 && r.score > 0 ? 'lead' : ''} ${r.me ? 'me' : ''}">
      <span class="pos">${i + 1}</span>
      <div class="who"><b>${esc(r.name)}</b><span class="num">${fmtNum(r.volume)} kg em ${r.sessions} treino${r.sessions === 1 ? '' : 's'} · ${fmtKg(r.bw)} kg corporal</span></div>
      <div class="score"><b>${fmtNum(r.score, 1)}</b><span>pts</span></div>
      <div class="bar"><i style="width:${(r.score / top) * 100}%"></i></div>
    </div>`).join('');

  const partnerRows = partners.map((p) => {
    const logging = f.type === 'extra' && f.id === p.id;
    return `<div class="row" style="flex-wrap:wrap">
      <div class="grow" style="flex:1 1 140px"><div class="title">${esc(p.name)}</div><div class="sub num">${fmtKg(p.bw)} kg corporal</div></div>
      <div class="inline-actions"><button class="btn" style="min-height:40px" data-action="formExtra" data-id="${p.id}">Treino avulso</button>
      <button class="btn ghost danger" style="min-height:40px" data-action="removePartner" data-id="${p.id}">Remover</button></div>
      ${logging ? `<form class="form" data-form="extra" data-id="${p.id}" style="flex-basis:100%;padding:12px">
        <div class="input"><label for="extraVol">Tonelagem de ${esc(p.name)} sem você (kg)</label><input id="extraVol" name="volume" inputmode="decimal" placeholder="ex.: 3200" required></div>
        <div class="inline-actions"><button class="btn primary" type="submit">Somar à semana</button><button class="btn ghost" type="button" data-action="formClose">Cancelar</button></div>
      </form>` : ''}
    </div>`;
  }).join('');

  const addForm = f.type === 'add' ? `<form class="form" data-form="add">
      <div class="form-row">
        <div class="input"><label for="pName">Nome</label><input id="pName" name="name" maxlength="24" placeholder="ex.: Rafa" required></div>
        <div class="input"><label for="pBw">Peso corporal (kg)</label><input id="pBw" name="bw" inputmode="decimal" placeholder="ex.: 72" required></div>
      </div>
      <div class="inline-actions"><button class="btn primary" type="submit">Adicionar parceiro</button><button class="btn ghost" type="button" data-action="formClose">Cancelar</button></div>
    </form>` : `<button class="btn block" data-action="formAdd">+ Adicionar parceiro</button>`;

  return `
    <header style="display:flex;flex-direction:column;gap:6px">
      <div class="eyebrow">${weekLabel()}</div>
      <h1>Duelo de tonelagem</h1>
    </header>
    <div class="formula">
      <code>pontos = tonelagem da semana ÷ peso corporal</code>
      <span class="hint">Tonelagem é a soma de carga × repetições de cada série feita. Dividir pelo peso corporal deixa a disputa justa entre pessoas de tamanhos diferentes.</span>
    </div>
    <section class="section">
      <div class="section-head"><h2>Placar</h2><span class="muted">zera toda segunda</span></div>
      <div class="board">${ranks}</div>
      ${partners.length ? '' : `<div class="empty"><b>Nenhum parceiro ainda</b><span>Adicione quem treina com você. Os treinos feitos juntos contam automaticamente para os dois.</span></div>`}
    </section>
    <section class="section">
      <h2>Seu peso corporal</h2>
      <form class="form" data-form="bw" style="flex-direction:row;align-items:flex-end;flex-wrap:wrap">
        <div class="input" style="flex:1 1 140px"><label for="myBw">Peso (kg)</label><input id="myBw" name="bw" inputmode="decimal" value="${fmtKg(profile.bw)}"></div>
        <button class="btn" type="submit">Salvar</button>
      </form>
    </section>
    <section class="section">
      <h2>Parceiros</h2>
      ${partners.length ? `<div class="list">${partnerRows}</div>` : ''}
      ${addForm}
    </section>`;
}

function viewHistory() {
  if (!history.length) return `
    <header style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Seus treinos</div><h1>Histórico</h1></header>
    <div class="empty"><b>Nenhum treino concluído ainda</b><span>Quando você tocar em “Concluir treino”, ele aparece aqui com as cargas anotadas.</span>
      <button class="btn primary" data-action="nav" data-view="home">Ver a ficha</button></div>`;
  const rows = history.map((h) => {
    const d = new Date(h.startedAt);
    return `<div class="row"><span class="disc sm p-${h.workoutId}">${h.workoutId}</span>
      <div class="grow"><div class="title">${esc(h.name)}</div>
      <div class="sub num">${DAY_SHORT[dayIdx(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]} · ${fmtDur(h.durationSec)} · ${h.sets} séries${h.partner ? ' · com ' + esc(h.partner.name) : ''}</div></div>
      <div style="text-align:right"><b class="num" style="font:700 1.2rem/1 var(--display)">${fmtNum(h.volume)}</b><div class="sub">kg</div></div></div>`;
  }).join('');
  const total = history.reduce((a, h) => a + h.volume, 0);
  return `
    <header style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Seus treinos</div><h1>Histórico</h1></header>
    <div class="stats">
      <div class="stat"><b class="num">${history.length}</b><span>Treinos</span></div>
      <div class="stat"><b class="num">${fmtNum(total / 1000, 1)}</b><span>Toneladas</span></div>
      <div class="stat"><b class="num">${fmtNum(history.reduce((a, h) => a + h.sets, 0))}</b><span>Séries</span></div>
    </div>
    <div class="list">${rows}</div>`;
}

/* ------------------------------------------------------------------ *
 * Plan editor: split, weekdays, workouts and exercises               *
 * ------------------------------------------------------------------ */
const sameWeek = (a, b) => a.every((x, i) => (x || null) === (b[i] || null));
const daysOf = (id) => WEEK_PLAN.map((w, i) => (w === id ? DAY_SHORT[i] : null)).filter(Boolean);
const inProgress = (id) => S && S.workoutId === id;

function viewPlan() {
  const ids = workoutIds();
  const current = SPLITS.find((sp) => sameWeek(sp.week, WEEK_PLAN));
  const splits = SPLITS.map((sp) => `<button class="split" data-action="split" data-id="${sp.id}" aria-pressed="${current === sp}"><b>${sp.label}</b><span>${sp.hint}</span></button>`).join('');
  const days = DAY_SHORT.map((d, i) => `<div class="day-row"><b>${d}</b><div class="day-pick" role="group" aria-label="Treino de ${DAY_LONG[i]}">
      ${ids.map((id) => `<button class="disc p-${id}" data-action="setDay" data-day="${i}" data-id="${id}" aria-pressed="${WEEK_PLAN[i] === id}" aria-label="Treino ${id}">${id}</button>`).join('')}
      <button class="off" data-action="setDay" data-day="${i}" data-id="" aria-pressed="${!WORKOUTS[WEEK_PLAN[i]]}">Descanso</button>
    </div></div>`).join('');
  const list = ids.map((id) => {
    const w = WORKOUTS[id], dd = daysOf(id);
    return `<button class="row" data-action="editW" data-id="${id}"><span class="disc p-${id}">${id}</span>
      <div class="grow"><div class="title">${esc(w.name)}</div>
      <div class="sub">${w.exercises.length} exercício${w.exercises.length === 1 ? '' : 's'} · ${dd.length ? dd.join(', ') : 'fora da semana'}</div></div>
      ${inProgress(id) ? '<span class="chip today">Em andamento</span>' : ''}${ICON.chev}</button>`;
  }).join('');
  const free = LETTERS.find((l) => !WORKOUTS[l]);
  return `
    <header style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">Monte sua ficha</div><h1>Treinos</h1></header>
    <section class="section">
      <div class="section-head"><h2>Divisão</h2><span class="muted">${current ? current.label : 'Personalizada'}</span></div>
      <div class="splits">${splits}</div>
      <p class="hint" style="margin:0">Um modelo distribui os treinos pela semana e cria os que faltarem. Nenhum exercício é apagado.</p>
    </section>
    <section class="section">
      <h2>Semana</h2>
      <div class="list">${days}</div>
    </section>
    ${volumeSection()}
    <section class="section">
      <h2>Seus treinos</h2>
      ${ids.length ? `<div class="list">${list}</div>` : `<div class="empty"><b>Nenhum treino cadastrado</b><span>Escolha uma divisão acima ou crie um treino.</span></div>`}
      ${free ? `<button class="btn block" data-action="newW">+ Novo treino (${free})</button>` : '<p class="hint" style="margin:0">Limite de 6 treinos (A a F).</p>'}
    </section>`;
}

function volumeSection() {
  const goal = profile.goal || 'maint', rows = weeklyVolume();
  const by = (st) => rows.filter((r) => r.st === st);
  const names = (list) => list.map((r) => `${r.g.name} (${fmtNum(r.v, r.v % 1 ? 1 : 0)})`).join(', ');
  const lines = [];
  if (by('over').length) lines.push(`<p><span class="st st-over" data-icon="!">Overtraining</span><span>${names(by('over'))}: acima do volume que você consegue recuperar em ${GOALS[goal].label.toLowerCase()}.</span></p>`);
  if (by('high').length) lines.push(`<p><span class="st st-high" data-icon="↑">Alto</span><span>${names(by('high'))}: acima do ideal, ainda recuperável.</span></p>`);
  if (by('under').length) lines.push(`<p><span class="st st-under" data-icon="↓">Undertraining</span><span>${names(by('under'))}: abaixo do mínimo para ${goal === 'maint' ? 'manter' : goal === 'bulk' ? 'crescer' : 'preservar massa'}.</span></p>`);
  if (!lines.length) lines.push(`<p><span class="st st-ok" data-icon="✓">Ideal</span><span>Todos os grupos na faixa certa para ${GOALS[goal].label.toLowerCase()}.</span></p>`);
  const meters = rows.map(({ g, v, z, st }) => {
    const dom = Math.max(z.max * 1.25, v * 1.05), pct = (x) => Math.min(100, (x / dom) * 100);
    return `<div class="vol-row">
      <div class="vol-head"><b>${g.name}</b><span class="num">${fmtNum(v, v % 1 ? 1 : 0)} séries</span><span class="st st-${st}" data-icon="${STATUS[st].icon}">${STATUS[st].label}</span></div>
      <div class="meter" role="img" aria-label="${g.name}: ${fmtNum(v, 1)} séries por semana; ideal de ${z.lo} a ${z.hi}; limite ${z.max}">
        <span class="band" style="left:${pct(z.lo)}%;width:${pct(z.hi) - pct(z.lo)}%"></span>
        <i class="fill st-${st}" style="width:${pct(v)}%"></i>
        <span class="limit" style="left:calc(${pct(z.max)}% - 1px)"></span>
      </div>
      <div class="meter-scale"><span>ideal ${z.lo}–${z.hi}</span><span>limite ${z.max}</span></div>
    </div>`;
  }).join('');
  return `<section class="section" id="volume">
      <div class="section-head"><h2>Volume semanal</h2><span class="muted">séries por grupo</span></div>
      <div class="seg" role="group" aria-label="Objetivo" style="align-self:flex-start">
        ${Object.entries(GOALS).map(([k, x]) => `<button data-action="goal" data-id="${k}" aria-pressed="${goal === k}">${x.label}</button>`).join('')}
      </div>
      <p class="hint" style="margin:0">${GOALS[goal].hint}</p>
      <div class="verdict">${lines.join('')}</div>
      <div class="vol-list">${meters}</div>
      <p class="hint" style="margin:0">Soma as séries de todos os dias da semana. Exercícios compostos contam meia série para os músculos auxiliares (supino → tríceps e ombros). A faixa verde é o ideal para o objetivo; o traço vermelho é o limite de recuperação.</p>
    </section>`;
}

function coverageSection(w) {
  const groups = workoutGroups(w);
  const inW = new Set(w.exercises.map((ex) => norm(ex.name)));
  const byGroup = Object.fromEntries(GROUPS.map((g) => [g.id, 0])), bySub = {};
  w.exercises.forEach((ex) => addSets(ex, byGroup, bySub));
  const week = Object.fromEntries(weeklyVolume().map((r) => [r.g.id, r]));
  const chips = GROUPS.map((g) => `<button class="pill" data-action="wGroup" data-id="${g.id}" aria-pressed="${groups.includes(g.id)}">${g.name}</button>`).join('');
  const cards = groups.map((gid) => {
    const g = GROUP[gid], wk = week[gid];
    const subs = g.subs.map(([sid, sname]) => {
      const n = bySub[sid] || 0;
      if (n) return `<div class="sub-row"><div class="sub-line"><span>${sname}</span><span class="num">${n} séries</span><span class="st st-ok" data-icon="✓">Coberto</span></div></div>`;
      const sug = EX_LIBRARY.filter(([name, t]) => t === sid && !inW.has(norm(name))).slice(0, 3);
      return `<div class="sub-row miss"><div class="sub-line"><span>${sname}</span><span class="st st-under" data-icon="↓">Sem exercício</span></div>
        ${sug.length ? `<div class="suggest">${sug.map(([name]) => `<button data-action="quickAdd" data-name="${esc(name)}">+ ${esc(name)}</button>`).join('')}</div>` : ''}</div>`;
    }).join('');
    return `<div class="cover"><div class="cover-head"><b>${g.name}</b>
      <span class="num">${fmtNum(byGroup[gid], byGroup[gid] % 1 ? 1 : 0)} séries aqui · ${fmtNum(wk.v, wk.v % 1 ? 1 : 0)}/semana <span class="st st-${wk.st}" data-icon="${STATUS[wk.st].icon}">${STATUS[wk.st].label}</span></span></div>${subs}</div>`;
  }).join('');
  return `<section class="section">
      <div class="section-head"><h2>Grupos musculares</h2><button class="link" data-action="volLink">Ver volume</button></div>
      <div class="partner-pick">${chips}</div>
      ${groups.length ? `<p class="hint" style="margin:0">Cada grupo é dividido nas partes que respondem a movimentos diferentes. Toque numa sugestão para cobrir o que falta.</p>${cards}`
        : `<p class="hint" style="margin:0">Escolha os grupos deste treino para ver as sugestões de subgrupos.</p>`}
    </section>`;
}

function quickAdd(name) {
  const lib = libByName(name), w = WORKOUTS[ui.editId]; if (!lib || !w) return;
  const compound = lib[2].length > 0;
  w.exercises.push({ id: 'ex-' + uid(), name: lib[0], target: lib[1], sec: lib[2], muscle: SUB[lib[1]].name,
    sets: compound ? 4 : 3, reps: compound ? 10 : 12, exec: 40, rest: compound ? 90 : 60, load: 10 });
  savePlan(); render(); toast(lib[0] + ' adicionado · toque nele para ajustar');
}

function viewEdit() {
  const w = WORKOUTS[ui.editId];
  const rows = w.exercises.map((ex, i) => `<div class="ed-ex">
      <span class="idx num">${i + 1}</span>
      <button class="grow" data-action="exEdit" data-i="${i}"><div class="title" style="font-weight:600">${esc(ex.name)}</div>
        <div class="sub muted num" style="font-size:.85rem">${exMuscle(ex) ? esc(exMuscle(ex)) + ' · ' : ''}${ex.sets} × ${ex.reps} · ${ex.rest}s intervalo · ${fmtKg(ex.load)} kg</div></button>
      <div class="moves">
        <button class="icon-btn" data-action="exMove" data-i="${i}" data-d="-1" aria-label="Subir ${esc(ex.name)}" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
        <button class="icon-btn" data-action="exMove" data-i="${i}" data-d="1" aria-label="Descer ${esc(ex.name)}" ${i === w.exercises.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
      </div>
    </div>`).join('');
  const dd = daysOf(w.id);
  return `
    <button class="back" data-action="nav" data-view="plan">${ICON.back} Treinos</button>
    <header class="w-head"><div class="disc lg p-${w.id}">${w.id}</div>
      <div style="flex:1;min-width:0" class="input"><label for="wName">Nome do treino ${w.id}</label>
      <input id="wName" data-plan="name" maxlength="40" value="${esc(w.name)}" placeholder="ex.: Peito e Tríceps"></div>
    </header>
    <p class="hint" style="margin:0">${dd.length ? 'Na semana: ' + dd.join(', ') + '.' : 'Este treino ainda não está em nenhum dia da semana.'} <button class="link" data-action="nav" data-view="plan">Mudar dias</button></p>
    <section class="section">
      <div class="section-head"><h2>Exercícios</h2><span class="muted num">${w.exercises.length}</span></div>
      ${w.exercises.length ? `<div class="list">${rows}</div>` : `<div class="empty"><b>Nenhum exercício ainda</b><span>Adicione na ordem em que vai fazer. Dá para reordenar depois.</span></div>`}
      <button class="btn primary block" data-action="exNew">+ Adicionar exercício</button>
    </section>
    ${coverageSection(w)}
    <button class="btn ghost danger" data-action="askDelW" data-id="${w.id}">Excluir treino ${w.id}</button>`;
}

function openExerciseSheet(i) {
  const w = WORKOUTS[ui.editId];
  const ex = i >= 0 ? w.exercises[i] : { name: '', target: '', sets: 3, reps: 12, exec: 40, rest: 60, load: 10 };
  const t = exTarget(ex) || '';
  const opts = GROUPS.map((g) => `<optgroup label="${g.name}">${g.subs.map(([sid, sn]) => `<option value="${sid}" ${sid === t ? 'selected' : ''}>${sn}</option>`).join('')}</optgroup>`).join('');
  const num = (id, label, name, val, mode = 'numeric') => `<div class="input"><label for="${id}">${label}</label><input id="${id}" name="${name}" inputmode="${mode}" value="${val}" required></div>`;
  openModal(`<h2>${i >= 0 ? 'Editar exercício' : 'Novo exercício'}</h2>
    <form class="form" data-form="ex" data-i="${i}" style="padding:0;border:0">
      <div class="input"><label for="exName">Exercício</label><input id="exName" name="name" list="exLib" maxlength="60" value="${esc(ex.name)}" placeholder="Digite ou escolha da lista" required autocomplete="off"></div>
      <div class="input"><label for="exTarget">Músculo-alvo</label><select id="exTarget" name="target"><option value="">Escolha o subgrupo</option>${opts}</select></div>
      <div class="grid-2">
        ${num('exSets', 'Séries', 'sets', ex.sets)}
        ${num('exReps', 'Repetições', 'reps', ex.reps)}
        ${num('exExec', 'Tempo da série (s)', 'exec', ex.exec)}
        ${num('exRest', 'Intervalo (s)', 'rest', ex.rest)}
      </div>
      ${num('exLoad', 'Carga inicial (kg)', 'load', fmtKg(ex.load), 'decimal')}
      <button class="btn primary big" type="submit">${i >= 0 ? 'Salvar exercício' : 'Adicionar ao treino'}</button>
      ${i >= 0 ? `<button class="btn danger" type="button" data-action="exDel" data-i="${i}">Remover do treino</button>` : ''}
      <button class="btn ghost" type="button" data-action="closeModal">Cancelar</button>
    </form>`);
  if (i < 0) setTimeout(() => $('#exName') && $('#exName').focus(), 50);
}

function saveExercise(form) {
  const d = new FormData(form), w = WORKOUTS[ui.editId], i = +form.dataset.i;
  const name = String(d.get('name') || '').trim();
  const int = (k) => Math.round(parseNum(d.get(k)));
  const target = SUB[d.get('target')] ? d.get('target') : null, lib = libByName(name);
  const ex = { name, target, muscle: target ? SUB[target].name : '', sec: lib && lib[1] === target ? lib[2] : [], sets: int('sets'), reps: int('reps'), exec: int('exec'), rest: int('rest'), load: parseNum(d.get('load')) };
  if (!name) return toast('Informe o nome do exercício');
  if (!(ex.sets >= 1 && ex.sets <= 10)) return toast('Séries: de 1 a 10');
  if (!(ex.reps >= 1 && ex.reps <= 100)) return toast('Repetições: de 1 a 100');
  if (!(ex.exec >= 5 && ex.exec <= 600)) return toast('Tempo da série: de 5 a 600 s');
  if (!(ex.rest >= 0 && ex.rest <= 600)) return toast('Intervalo: de 0 a 600 s');
  if (!(ex.load >= 0 && ex.load <= 1000)) return toast('Carga: de 0 a 1000 kg');
  if (i >= 0) Object.assign(w.exercises[i], ex);
  else w.exercises.push(Object.assign({ id: 'ex-' + uid() }, ex));
  savePlan(); closeModal(); render(); toast(i >= 0 ? 'Exercício salvo' : 'Exercício adicionado');
}

function applySplit(sp) {
  sp.letters.forEach((l) => { if (!WORKOUTS[l]) WORKOUTS[l] = { id: l, name: 'Novo treino', exercises: [] }; });
  WEEK_PLAN.splice(0, 7, ...sp.week);
  savePlan(); closeModal(); render(); toast('Divisão ' + sp.label + ' aplicada');
}

/* ------------------------------------------------------------------ *
 * Confirmation modal (the app does not use the browser's confirm())  *
 * ------------------------------------------------------------------ */
function openModal(html) { $('#toast').hidden = true; const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

/* ------------------------------------------------------------------ *
 * Events                                                              *
 * ------------------------------------------------------------------ */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  if (S) ensureAudio(); // audio may only start after a tap (e.g. a workout resumed after a reload)
  switch (a) {
    case 'nav': closeModal(); go(b.dataset.view, { form: null }); break;
    case 'open': go('workout', { workoutId: id }); break;
    case 'resume': if (S) go('session'); break;
    case 'start': startWorkout(id); break;
    case 'pickPartner': ui.withPartner = id || null; render(); break;
    case 'begin': beginExercise(); break;
    case 'setDone': finishSet(false); break;
    case 'skipRest': endRest(false); break;
    case 'pause': togglePause(); break;
    case 'add': addTime(15); break;
    case 'nextEx': gotoExercise(S.exIndex + 1); break;
    case 'prevEx': gotoExercise(S.exIndex - 1); break;
    case 'sound':
      settings.sound = !settings.sound; store.set('fg.settings', settings); ensureAudio();
      b.innerHTML = settings.sound ? ICON.soundOn : ICON.soundOff;
      b.setAttribute('aria-label', settings.sound ? 'Desligar som' : 'Ligar som');
      toast(settings.sound ? 'Som ligado' : 'Som desligado');
      break;
    case 'owner':
      ui.owner = id; document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.id === id));
      $('#sets').innerHTML = setsRows(curEx()); updateSession(); break;
    case 'toggleSet': {
      const ex = curEx(), s = S.logs[ui.owner][ex.id][+b.dataset.set];
      s.done = !s.done; saveLoads(ex); persist(); updateSession(); break;
    }
    case 'step': {
      const ex = curEx(), i = +b.dataset.set, s = S.logs[ui.owner][ex.id][i];
      s.kg = Math.max(0, Math.round(((s.kg || 0) + parseFloat(b.dataset.d)) * 100) / 100);
      document.getElementById(`k-${ex.id}-${i}`).value = fmtKg(s.kg);
      saveLoads(ex); persist(); break;
    }
    case 'askEnd': {
      const done = logVolume(S.logs.me).sets;
      openModal(`<h2>Encerrar treino?</h2><p class="muted" style="margin:0">${done ? `Você já fez ${done} série${done === 1 ? '' : 's'}. Salve para registrar as cargas no histórico.` : 'Nenhuma série foi concluída ainda.'}</p>
        ${done ? '<button class="btn primary big" data-action="finish">Salvar e encerrar</button>' : ''}
        <button class="btn danger" data-action="discard">Descartar treino</button>
        <button class="btn ghost" data-action="closeModal">Continuar treinando</button>`);
      break;
    }
    case 'askFinish': {
      const pending = curW().exercises.reduce((a, ex) => a + S.logs.me[ex.id].filter((s) => !s.done).length, 0);
      if (!pending) { finishWorkout(); break; }
      openModal(`<h2>Concluir treino?</h2><p class="muted" style="margin:0">Faltam ${pending} série${pending === 1 ? '' : 's'} sem marcar. Elas ficam de fora da tonelagem.</p>
        <button class="btn primary big" data-action="finish">Concluir assim mesmo</button>
        <button class="btn ghost" data-action="closeModal">Voltar ao treino</button>`);
      break;
    }
    case 'finish': finishWorkout(); break;
    case 'discard': discardWorkout(); break;
    case 'closeModal': closeModal(); break;
    case 'formAdd': ui.form = { type: 'add' }; render(); $('#pName') && $('#pName').focus(); break;
    case 'formExtra': ui.form = { type: 'extra', id }; render(); $('#extraVol') && $('#extraVol').focus(); break;
    case 'formClose': ui.form = null; render(); break;
    case 'removePartner': {
      const p = partnerById(id);
      openModal(`<h2>Remover ${esc(p.name)}?</h2><p class="muted" style="margin:0">A pessoa sai do placar. Seu histórico de treinos continua salvo.</p>
        <button class="btn danger big" data-action="confirmRemove" data-id="${id}">Remover</button>
        <button class="btn ghost" data-action="closeModal">Cancelar</button>`);
      break;
    }
    case 'split': {
      const sp = SPLITS.find((x) => x.id === id), missing = sp.letters.filter((l) => !WORKOUTS[l]);
      openModal(`<h2>Usar divisão ${sp.label}?</h2><p class="muted" style="margin:0">A semana fica assim: ${sp.week.map((w, i) => (w ? DAY_SHORT[i] + ' ' + w : null)).filter(Boolean).join(', ')}; os outros dias viram descanso.${missing.length ? ' Serão criados os treinos ' + missing.join(', ') + ', vazios, para você cadastrar os exercícios.' : ''} Nenhum exercício é apagado.</p>
        <button class="btn primary big" data-action="confirmSplit" data-id="${sp.id}">Aplicar ${sp.label}</button>
        <button class="btn ghost" data-action="closeModal">Cancelar</button>`);
      break;
    }
    case 'confirmSplit': applySplit(SPLITS.find((x) => x.id === id)); break;
    case 'setDay': WEEK_PLAN[+b.dataset.day] = id || null; savePlan(); render(); break;
    case 'newW': {
      const l = LETTERS.find((x) => !WORKOUTS[x]); if (!l) break;
      WORKOUTS[l] = { id: l, name: 'Novo treino', exercises: [] }; savePlan();
      go('edit', { editId: l }); setTimeout(() => { const n = $('#wName'); if (n) { n.focus(); n.select(); } }, 50);
      break;
    }
    case 'editW':
      if (inProgress(id)) { toast('Conclua o treino em andamento para editá-lo'); break; }
      go('edit', { editId: id }); break;
    case 'exNew': openExerciseSheet(-1); break;
    case 'quickAdd': quickAdd(b.dataset.name); break;
    case 'goal': profile.goal = id; store.set('fg.profile', profile); render(); break;
    case 'volLink': go('plan'); setTimeout(() => { const v = $('#volume'); if (v) v.scrollIntoView({ behavior: 'smooth' }); }, 30); break;
    case 'wGroup': {
      const w = WORKOUTS[ui.editId];
      const withEx = new Set(w.exercises.map(exTarget).filter(Boolean).map((t) => SUB[t].group));
      if (withEx.has(id)) { toast('Remova os exercícios de ' + GROUP[id].name + ' para tirar o grupo'); break; }
      const cur = workoutGroups(w);
      w.groups = cur.includes(id) ? cur.filter((x) => x !== id) : cur.concat(id);
      savePlan(); render(); break;
    }
    case 'exEdit': openExerciseSheet(+b.dataset.i); break;
    case 'exMove': {
      const arr = WORKOUTS[ui.editId].exercises, i = +b.dataset.i, j = i + +b.dataset.d;
      if (j < 0 || j >= arr.length) break;
      [arr[i], arr[j]] = [arr[j], arr[i]]; savePlan(); render(); break;
    }
    case 'exDel': {
      const arr = WORKOUTS[ui.editId].exercises, ex = arr[+b.dataset.i];
      arr.splice(+b.dataset.i, 1); savePlan(); closeModal(); render(); toast(ex.name + ' removido'); break;
    }
    case 'askDelW': {
      if (inProgress(id)) { toast('Conclua o treino em andamento antes de excluir'); break; }
      const w = WORKOUTS[id];
      openModal(`<h2>Excluir Treino ${id}?</h2><p class="muted" style="margin:0">${esc(w.name)} e seus ${w.exercises.length} exercícios saem da ficha. Os dias com este treino viram descanso. Seu histórico continua salvo.</p>
        <button class="btn danger big" data-action="confirmDelW" data-id="${id}">Excluir treino</button>
        <button class="btn ghost" data-action="closeModal">Cancelar</button>`);
      break;
    }
    case 'confirmDelW':
      delete WORKOUTS[id];
      WEEK_PLAN.forEach((w, i) => { if (w === id) WEEK_PLAN[i] = null; });
      if (ui.workoutId === id) ui.workoutId = null;
      savePlan(); closeModal(); go('plan'); toast('Treino ' + id + ' excluído'); break;
    case 'confirmRemove':
      partners = partners.filter((p) => p.id !== id); store.set('fg.partners', partners);
      if (ui.withPartner === id) ui.withPartner = null;
      closeModal(); render(); toast('Parceiro removido'); break;
  }
});

document.addEventListener('input', (e) => {
  const inp = e.target;
  if (inp.dataset.plan === 'name' && WORKOUTS[ui.editId]) { WORKOUTS[ui.editId].name = inp.value.trim() || 'Sem nome'; savePlan(); return; }
  if (inp.id === 'exName') {
    const hit = libByName(inp.value), m = $('#exTarget');
    if (hit && m && (!m.value || m.dataset.auto)) { m.value = hit[1]; m.dataset.auto = '1'; }
    return;
  }
  if (!inp.dataset.field || !S) return;
  const ex = curEx(), s = S.logs[ui.owner][ex.id][+inp.dataset.set];
  const n = parseNum(inp.value); if (n === null) return;
  if (inp.dataset.field === 'kg') s.kg = Math.max(0, n); else s.reps = Math.max(0, Math.round(n));
  saveLoads(ex); persist();
});

document.addEventListener('change', (e) => { if (e.target.id === 'exTarget') delete e.target.dataset.auto; });

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, data = new FormData(f);
  if (kind === 'ex') return saveExercise(f);
  if (kind === 'bw') {
    const bw = parseNum(data.get('bw'));
    if (!bw || bw < 30 || bw > 300) return toast('Informe um peso entre 30 e 300 kg');
    profile.bw = bw; store.set('fg.profile', profile); render(); toast('Peso atualizado');
  }
  if (kind === 'add') {
    const name = String(data.get('name') || '').trim(), bw = parseNum(data.get('bw'));
    if (!name) return toast('Informe o nome do parceiro');
    if (!bw || bw < 30 || bw > 300) return toast('Informe um peso entre 30 e 300 kg');
    partners.push({ id: uid(), name, bw }); store.set('fg.partners', partners);
    ui.form = null; render(); toast(name + ' entrou no duelo');
  }
  if (kind === 'extra') {
    const v = parseNum(data.get('volume'));
    if (!v || v <= 0) return toast('Informe a tonelagem em kg');
    partnerExtra.push({ partnerId: f.dataset.id, date: dateKey(new Date()), volume: Math.round(v) }); store.set('fg.partnerExtra', partnerExtra);
    ui.form = null; render(); toast('Treino somado ao placar');
  }
});

$('#exLib').innerHTML = EX_LIBRARY.map(([n]) => `<option value="${esc(n)}"></option>`).join('');
render();
if (S) keepAwake();
</script>
</body>
</html>
